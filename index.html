<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a25"><meta name="description" content="ChandaSetu helps community committees record contributions, issue receipts and track event expenses.">
<title>ChandaSetu — Community accounts, made clear</title>
<style>
:root{--ink:#14231f;--muted:#68766f;--line:#e5eae6;--bg:#f5f7f4;--green:#176b50;--pale:#e7f3ed;--gold:#d8a94d;--white:#fff;--red:#b54747}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--green);color:white}.soft{background:var(--pale);color:var(--green)}.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#102a25;color:white;padding:25px 17px;display:flex;flex-direction:column;gap:25px}.brand{font-size:23px;font-weight:850}.brand span{color:var(--gold)}.tag{font-size:10px;letter-spacing:1.5px;color:#a8bdb4;text-transform:uppercase}.orgbox{background:#1b3a32;color:white;border:1px solid #315247;border-radius:12px;padding:12px;text-align:left}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#c3d3cc;text-align:left}.nav button.active,.nav button:hover{background:#21483c;color:white}.foot{margin-top:auto;color:#91a99e;font-size:12px}.main{min-width:0}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top small,.muted{color:var(--muted)}.content{padding:28px;max-width:1400px;margin:auto}.heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--green);font-weight:800;text-transform:uppercase}.heading h1{font-size:28px;letter-spacing:-1px;margin:3px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:17px}.statlabel{color:var(--muted);font-size:13px}.stat{font-size:26px;font-weight:800;margin:6px 0}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.panel h3{margin:0 0 13px;font-size:16px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);background:#fafcfb}tr:last-child td{border:0}.pill{font-size:11px;border-radius:30px;padding:4px 8px;background:var(--pale);color:var(--green);font-weight:700}.empty{text-align:center;padding:30px;color:var(--muted)}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid #dce4de;border-radius:9px;padding:10px;background:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#0b211bcc;display:grid;place-items:center;padding:16px;z-index:5}.modal{background:white;border-radius:17px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 17px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:20px;right:20px;background:#102a25;color:white;padding:12px 16px;border-radius:10px;z-index:8}.receipt{max-width:680px;margin:10px auto;padding:25px;border:1px solid #dce4de;background:white}.receipthead{text-align:center;border-bottom:2px solid var(--green);padding-bottom:14px}.receipthead h2{color:var(--green);margin:0}.amount{font-size:30px;font-weight:850;color:var(--green)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 18px}}@media(max-width:520px){.heading{display:block}.heading .toolbar{margin-top:12px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.cards{gap:8px}.card{padding:12px}.stat{font-size:21px}.content{padding:14px}.heading h1{font-size:24px}}@media print{body{background:white}.side,.top,.no-print{display:none!important}.layout{display:block}.content{padding:0}.receipt{border:0}}
</style>
</head>
<body>
<div class="layout">
<aside class="side"><div><div class="brand">Chanda<span>Setu</span></div><div class="tag">Community accounts, made clear</div></div>
<button class="orgbox" id="orgLabel">Singh Council</button>
<nav class="nav" id="nav">
<button class="active" data-page="overview">▦ &nbsp; Overview</button><button data-page="events">▣ &nbsp; Events</button><button data-page="donations">＋ &nbsp; Chanda collection</button><button data-page="expenses">↗ &nbsp; Expenses</button><button data-page="collectors">♙ &nbsp; Collectors</button><button data-page="reports">▤ &nbsp; Reports</button><button data-page="organizations">⌂ &nbsp; Organizations</button>
</nav><div class="foot">DEMO MODE · Data stays in this browser<br>ChandaSetu v0.1</div></aside>
<main class="main"><header class="top"><div><b id="pageTitle">Overview</b><br><small>Community workspace · Demo</small></div><div class="toolbar"><button class="soft" onclick="openDonation()">＋ Add chanda</button><button class="primary" onclick="openEvent()">＋ New event</button></div></header><div class="content" id="app"></div></main>
</div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const initial={orgs:[{id:'org1',name:'Singh Council',city:'Halsi, Bihar',code:'SC'}],events:[{id:'ev1',org:'org1',name:'Saraswati Puja 2027',type:'Saraswati Puja',date:'2027-02-03',goal:100000}],collectors:[{id:'c1',org:'org1',name:'Shivam Kumar',phone:''},{id:'c2',org:'org1',name:'Rahul Kumar',phone:''}],donations:[{id:'d1',receipt:'SC-2026-000001',org:'org1',event:'ev1',name:'Ravi Kumar',amount:501,mode:'Cash',collector:'c1',date:'2026-11-08'},{id:'d2',receipt:'SC-2026-000002',org:'org1',event:'ev1',name:'Pooja Devi',amount:1100,mode:'UPI',collector:'c2',date:'2026-11-08'}],expenses:[{id:'x1',org:'org1',event:'ev1',title:'Decoration advance',amount:2500,date:'2026-11-08',paidBy:'Shivam'}]};
let db=JSON.parse(localStorage.getItem('chandasetu_db')||'null')||initial,currentOrg='org1',page='overview';
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const org=()=>db.orgs.find(x=>x.id===currentOrg)||db.orgs[0],events=()=>db.events.filter(x=>x.org===currentOrg),dons=()=>db.donations.filter(x=>x.org===currentOrg),exps=()=>db.expenses.filter(x=>x.org===currentOrg),coll=()=>db.collectors.filter(x=>x.org===currentOrg);
const eventName=id=>db.events.find(x=>x.id===id)?.name||'—',collectorName=id=>db.collectors.find(x=>x.id===id)?.name||'—';
function save(){localStorage.setItem('chandasetu_db',JSON.stringify(db));render()}
function toast(s){$('toastroot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('toastroot').innerHTML='',2200)}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function render(){if(!db.orgs.length){db.orgs.push({id:'org1',name:'My organization',city:'',code:'ORG'});currentOrg='org1'}$('orgLabel').innerHTML=esc(org().name)+'<br><small>'+esc(org().city)+' ▾</small>';const titles={overview:'Overview',events:'Events',donations:'Chanda collection',expenses:'Expenses',collectors:'Collectors',reports:'Reports',organizations:'Organizations'};$('pageTitle').textContent=titles[page]||'Overview';const el=$('app');({overview:overview,events:eventsPage,donations:donationsPage,expenses:expensesPage,collectors:collectorsPage,reports:reportsPage,organizations:orgsPage}[page]||overview)(el)}
function heading(k,t,d,btn=''){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><div class="muted">'+d+'</div></div>'+btn+'</div>'}
function table(rows,headers){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+ (rows||'')+'</tbody></table></div>'}
function overview(el){const income=dons().reduce((s,d)=>s+ +d.amount,0),out=exps().reduce((s,x)=>s+ +x.amount,0),active=events().length;el.innerHTML=heading('Your committee at a glance','Overview','Track collections, spending and event progress in one place.')+'<div class="cards"><div class="card"><div class="statlabel">Total collection</div><div class="stat">'+money(income)+'</div></div><div class="card"><div class="statlabel">Total expenses</div><div class="stat">'+money(out)+'</div></div><div class="card"><div class="statlabel">Available balance</div><div class="stat">'+money(income-out)+'</div></div><div class="card"><div class="statlabel">Active events</div><div class="stat">'+active+'</div></div></div><div class="grid2"><div class="panel"><h3>Recent contributions</h3>'+table(dons().slice(-5).reverse().map(d=>'<tr><td>'+esc(d.receipt)+'</td><td>'+esc(d.name)+'</td><td>'+money(d.amount)+'</td><td>'+esc(d.mode)+'</td></tr>').join(''),['Receipt','Donor','Amount','Mode'])+'</div><div class="panel"><h3>Event snapshot</h3>'+events().map(e=>'<p><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.date||'Date not set')+'</span><br><span class="pill">'+money(dons().filter(d=>d.event===e.id).reduce((s,d)=>s+ +d.amount,0))+' collected</span></p>').join('')+'</div></div>'}
function eventsPage(el){el.innerHTML=heading('Programs & celebrations','Events','Create a separate account for every puja or community event.','<button class="primary" onclick="openEvent()">＋ Add event</button>')+'<div class="cards">'+(events().map(e=>'<div class="card"><span class="pill">'+esc(e.type)+'</span><h3>'+esc(e.name)+'</h3><div class="muted">'+esc(e.date||'Date not set')+'</div><div class="stat">'+money(dons().filter(d=>d.event===e.id).reduce((s,d)=>s+ +d.amount,0))+'</div><div class="statlabel">of '+money(e.goal)+' goal</div><button class="soft" onclick="openDonation(\''+e.id+'\')">＋ Add contribution</button></div>').join('')||'<div class="empty">No events yet. Create your first event.</div>')+'</div>'}
function donationRows(arr){return arr.map(d=>'<tr><td>'+esc(d.receipt)+'</td><td>'+esc(d.name)+'</td><td>'+esc(eventName(d.event))+'</td><td><b>'+money(d.amount)+'</b></td><td>'+esc(d.mode)+'</td><td>'+esc(collectorName(d.collector))+'</td><td><button class="soft" onclick="showReceipt(\''+d.id+'\')">Receipt</button></td></tr>').join('')||'<tr><td colspan="7" class="empty">No contributions recorded.</td></tr>'}
function donationsPage(el){el.innerHTML=heading('Donor register','Chanda collection','Record cash and UPI contributions and issue a receipt.','<button class="primary" onclick="openDonation()">＋ Record chanda</button>')+'<div class="panel"><div class="toolbar"><input id="search" placeholder="Search donor or receipt..." oninput="filterDonations()" style="padding:10px;border:1px solid var(--line);border-radius:9px"><select id="eventFilter" onchange="filterDonations()" style="padding:10px;border:1px solid var(--line);border-radius:9px"><option value="">All events</option>'+events().map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('')+'</select></div><div style="height:12px"></div><div id="donTable">'+table(donationRows(dons().slice().reverse()),['Receipt','Donor','Event','Amount','Mode','Collector',''])+'</div></div>'}
function filterDonations(){const q=$('search').value.toLowerCase(),ev=$('eventFilter').value;const arr=dons().filter(d=>(!ev||d.event===ev)&&(d.name+' '+d.receipt).toLowerCase().includes(q)).reverse();$('donTable').innerHTML=table(donationRows(arr),['Receipt','Donor','Event','Amount','Mode','Collector',''])}
function expensesPage(el){el.innerHTML=heading('Money out','Expenses','Record event purchases and payments.','<button class="primary" onclick="openExpense()">＋ Add expense</button>')+'<div class="panel">'+table(exps().slice().reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.title)+'</td><td>'+esc(eventName(x.event))+'</td><td>'+esc(x.paidBy)+'</td><td><b>'+money(x.amount)+'</b></td></tr>').join('')||'<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>',['Date','Expense','Event','Paid by','Amount'])+'</div>'}
function collectorsPage(el){el.innerHTML=heading('Collection team','Collectors','See how much each collector has recorded.','<button class="primary" onclick="openCollector()">＋ Add collector</button>')+'<div class="cards">'+(coll().map(c=>'<div class="card"><span class="pill">Active</span><h3>'+esc(c.name)+'</h3><div class="muted">'+esc(c.phone||'No phone added')+'</div><div class="stat">'+money(dons().filter(d=>d.collector===c.id).reduce((s,d)=>s+ +d.amount,0))+'</div><div class="statlabel">Recorded collection</div></div>').join('')||'<div class="empty">No collectors added.</div>')+'</div>'}
function reportsPage(el){const inc=dons().reduce((s,d)=>s+ +d.amount,0),out=exps().reduce((s,x)=>s+ +x.amount,0);el.innerHTML=heading('Accountability','Reports','A transparent view of income, expenses and balance.','<div class="toolbar"><button class="ghost" onclick="exportCSV()">Export CSV</button><button class="primary" onclick="window.print()">Print report</button></div>')+'<div class="cards"><div class="card"><div class="statlabel">Income</div><div class="stat">'+money(inc)+'</div></div><div class="card"><div class="statlabel">Expenses</div><div class="stat">'+money(out)+'</div></div><div class="card"><div class="statlabel">Balance</div><div class="stat">'+money(inc-out)+'</div></div><div class="card"><div class="statlabel">Donations</div><div class="stat">'+dons().length+'</div></div></div><div class="panel"><h3>Event-wise summary</h3>'+table(events().map(e=>{const a=dons().filter(d=>d.event===e.id).reduce((s,d)=>s+ +d.amount,0),b=exps().filter(x=>x.event===e.id).reduce((s,x)=>s+ +x.amount,0);return '<tr><td>'+esc(e.name)+'</td><td>'+money(a)+'</td><td>'+money(b)+'</td><td><b>'+money(a-b)+'</b></td></tr>'}).join(''),['Event','Income','Expenses','Balance'])+'</div>'}
function orgsPage(el){el.innerHTML=heading('Workspaces','Organizations','Switch between committees and their separate demo accounts.','<button class="primary" onclick="openOrg()">＋ Add organization</button>')+'<div class="cards">'+db.orgs.map(o=>'<div class="card"><span class="pill">Organization</span><h3>'+esc(o.name)+'</h3><div class="muted">'+esc(o.city)+'</div><p><button class="soft" onclick="switchOrg(\''+o.id+'\')">Open workspace</button></p></div>').join('')+'</div>'}
function switchOrg(id){currentOrg=id;render();toast('Workspace switched')}
function modal(title,body,submit,label='Save'){ $('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+title+'</h2><form id="modalform">'+body+'<div class="actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="primary">'+label+'</button></div></form></div></div>';$('modalform').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));closeModal()}}
function closeModal(){$('modalroot').innerHTML=''}
function field(label,name,placeholder='',type='text',required=true){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" placeholder="'+placeholder+'" '+(required?'required':'')+'></div>'}
function selectField(label,name,opts){return '<div class="field"><label>'+label+'</label><select name="'+name+'" required>'+opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select></div>'}
function openEvent(){modal('Create an event','<div class="formgrid">'+field('Event name','name','e.g. Chhath Puja 2027')+selectField('Event type','type',[['Chhath Puja','Chhath Puja'],['Saraswati Puja','Saraswati Puja'],['Durga Puja','Durga Puja'],['Ganesh Puja','Ganesh Puja'],['Community event','Community event']])+field('Event date','date','','date')+field('Collection goal (₹)','goal','50000','number')+'</div>',f=>{db.events.push({id:uid(),org:currentOrg,name:f.get('name'),type:f.get('type'),date:f.get('date'),goal:+f.get('goal')||0});save();toast('Event created')})}
function openDonation(eventId=''){if(!events().length){toast('Create an event first');return}modal('Record a contribution','<div class="formgrid">'+field('Donor name','name','Full name')+field('Mobile (optional)','phone','10-digit number','tel',false)+selectField('Event','event',events().map(e=>[e.id,e.name]))+field('Amount (₹)','amount','501','number')+selectField('Payment mode','mode',[['Cash','Cash'],['UPI','UPI (manual record)']])+selectField('Collected by','collector',coll().map(c=>[c.id,c.name]))+field('UPI reference / note (optional)','note','Reference or note','text',false)+'</div>',f=>{const amount=+f.get('amount');if(!(amount>0)){toast('Enter a valid amount');return}const count=dons().length+1,receipt=(org().code||'ORG')+'-'+new Date().getFullYear()+'-'+String(count).padStart(6,'0');const d={id:uid(),receipt,org:currentOrg,event:f.get('event'),name:f.get('name'),phone:f.get('phone'),amount,mode:f.get('mode'),collector:f.get('collector'),date:new Date().toISOString().slice(0,10),note:f.get('note')};db.donations.push(d);save();toast('Contribution recorded');showReceipt(d.id)},'Save & generate receipt');if(eventId)$('modalform').querySelector('[name=event]').value=eventId}
function openExpense(){if(!events().length){toast('Create an event first');return}modal('Add an expense','<div class="formgrid">'+field('Expense title','title','e.g. Sound system')+field('Amount (₹)','amount','1500','number')+selectField('Event','event',events().map(e=>[e.id,e.name]))+field('Date','date',new Date().toISOString().slice(0,10),'date')+field('Paid by','paidBy','Name')+'</div>',f=>{const amount=+f.get('amount');if(!(amount>0)){toast('Enter a valid amount');return}db.expenses.push({id:uid(),org:currentOrg,title:f.get('title'),amount,event:f.get('event'),date:f.get('date'),paidBy:f.get('paidBy')});save();toast('Expense saved')})}
function openCollector(){modal('Add a collector','<div class="formgrid">'+field('Full name','name','Collector name')+field('Mobile number','phone','Optional','tel',false)+'</div>',f=>{db.collectors.push({id:uid(),org:currentOrg,name:f.get('name'),phone:f.get('phone')});save();toast('Collector added')})}
function openOrg(){modal('Add an organization','<div class="formgrid">'+field('Organization name','name','e.g. Youth Club')+field('City / location','city','Town, State')+'</div>',f=>{const id=uid();db.orgs.push({id,name:f.get('name'),city:f.get('city'),code:f.get('name').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'ORG'});currentOrg=id;save();toast('Organization created')})}
function showReceipt(id){const d=db.donations.find(x=>x.id===id);if(!d)return;$('modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="toolbar no-print" style="justify-content:flex-end"><button class="ghost" onclick="closeModal()">Close</button><button class="primary" onclick="window.print()">Print / Save PDF</button></div><div class="receipt"><div class="receipthead"><h2>'+esc(org().name)+'</h2><div>'+esc(org().city)+'</div><b>COMMUNITY CONTRIBUTION RECEIPT</b></div><p>Receipt: <b>'+esc(d.receipt)+'</b> &nbsp; Date: <b>'+esc(d.date)+'</b></p><p>Received with thanks from <b>'+esc(d.name)+'</b></p><p>For event: <b>'+esc(eventName(d.event))+'</b></p><p>Payment mode: <b>'+esc(d.mode)+'</b></p><p>Collected by: <b>'+esc(collectorName(d.collector))+'</b></p><hr><b>Contribution amount</b><div class="amount">'+money(d.amount)+'</div><p class="muted">Computer-generated receipt. UPI entries are recorded manually and should be verified against your bank statement.</p><center>Thank you for supporting the community.</center></div></div></div>'}
function exportCSV(){const rows=[['Receipt','Donor','Event','Amount','Mode','Collector','Date'],...dons().map(d=>[d.receipt,d.name,eventName(d.event),d.amount,d.mode,collectorName(d.collector),d.date])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='chandasetu-report.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
